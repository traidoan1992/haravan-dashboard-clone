<script>
    window.onTurnstileLoaded = function () {
        const executionTimeout = 60000; //60s
        let pendingExecution = null;
        let resolveExecution = null;
        let executionTimer = null;

        const responseField = document.getElementById(
            'cf-turnstile-response'
        );

        function finishExecution(success) {
            if (!success)
                responseField.value = '';

            if (executionTimer) {
                clearTimeout(executionTimer);
                executionTimer = null;
            }

            if (resolveExecution) {
                const resolve = resolveExecution;
                resolveExecution = null;
                pendingExecution = null;
                resolve(success);
            }
        }

        const widgetId = turnstile.render(
            '#turnstile-container',
            {
                sitekey: '0x4AAAAAAEF82yDJfVjf8h5U',
                theme: 'light',
                execution: 'execute',
                appearance: 'interaction-only',
                action: 'login',
                'response-field': false,

                callback: function (token) {
                    responseField.value = token;
                    finishExecution(true);
                },

                'error-callback': function (errorCode) {
                    console.warn('Turnstile error:', errorCode);
                    finishExecution(false);
                },

                'expired-callback': function () {
                    finishExecution(false);
                },

                'timeout-callback': function () {
                    finishExecution(false);
                },

                'unsupported-callback': function () {
                    console.warn('Turnstile does not support this browser.');
                    finishExecution(false);
                }
            }
        );

        window.executeTurnstile = function () {
            if (pendingExecution)
                return Promise.resolve(false);

            const execution = new Promise(function (resolve) {
                resolveExecution = resolve;
            });
            pendingExecution = execution;

            responseField.value = '';
            executionTimer = setTimeout(function () {
                console.warn('Turnstile execution timed out.');
                turnstile.reset(widgetId);
                finishExecution(false);
            }, executionTimeout);

            try {
                turnstile.reset(widgetId);
                turnstile.execute(widgetId);
            } catch (error) {
                console.warn('Unable to execute Turnstile:', error);
                finishExecution(false);
            }

            return execution;
        };
    };

    window.beforeSubmitWithTurnstile = async function (event) {
        event.preventDefault();

        const button = event.currentTarget;
        const form = button.closest('form');

        if (!form)
            return false;

        if (button.dataset.submitting === 'true')
            return false;

        button.dataset.submitting = 'true';

        const loading = button.querySelector('.loading-main');
        loading?.classList.remove('hidden');

        if (typeof window.executeTurnstile !== 'function') {
            button.dataset.submitting = 'false';
            loading?.classList.add('hidden');
            return false;
        }

        const valid = await window.executeTurnstile();

        if (!valid) {
            button.dataset.submitting = 'false';
            loading?.classList.add('hidden');
            return false;
        }

        if (typeof form.requestSubmit === 'function') {
            form.requestSubmit(button);
        } else {
            // iOS Safari < 16 (e.g. iOS 15) does not support requestSubmit().
            const btnName = button.getAttribute('name');
            if (btnName) {
                let hidden = form.querySelector('input[type="hidden"][name="' + btnName + '"]');
                if (!hidden) {
                    hidden = document.createElement('input');
                    hidden.type = 'hidden';
                    hidden.name = btnName;
                    form.appendChild(hidden);
                }
                hidden.value = button.value;
            }
            form.submit();
        }
        return false;
    };

</script>
