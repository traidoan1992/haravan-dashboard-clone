<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trang chưa được clone — Noritake Admin</title>
<style>
  :root { --blue:#2463EB; --gray:#4B5563; --line:#E5E7EB; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.6 -apple-system,"Segoe UI",Roboto,Arial,sans-serif; color:#111827; background:#F5F6F8; }
  .wrap { max-width:720px; margin:8vh auto; background:#fff; border:1px solid var(--line); border-radius:12px; padding:32px 36px; }
  h1 { font-size:20px; margin:0 0 6px; }
  p { color:var(--gray); margin:0 0 14px; }
  .path { display:inline-block; margin:8px 0 18px; padding:8px 12px; background:#F3F4F6; border-radius:8px;
          font-family:ui-monospace,Consolas,monospace; font-size:13px; color:#111827; word-break:break-all; }
  .actions { display:flex; gap:10px; flex-wrap:wrap; margin-top:8px; }
  a.btn { display:inline-block; padding:8px 16px; border-radius:8px; text-decoration:none; font-size:14px;
          border:1px solid var(--line); color:#111827; background:#fff; }
  a.btn.primary { background:var(--blue); border-color:var(--blue); color:#fff; }
  .note { margin-top:22px; padding-top:16px; border-top:1px solid var(--line); font-size:13px; color:#6B7280; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Trang này chưa được clone</h1>
    <p>Bản clone tĩnh chỉ chứa trang danh sách và các trang chi tiết thuộc <strong>trang 1</strong> của mỗi danh sách.</p>
    <div class="path" id="target">/admin/…</div>
    <div class="actions">
      <a class="btn primary" href="index.html">Về Tổng quan</a>
      <a class="btn" href="javascript:history.back()">Quay lại</a>
    </div>
    <div class="note">
      Đây là bản demo giao diện, không có backend và không gọi lên hệ thống thật.
    </div>
  </div>
  <script>
    // Đường dẫn gốc được truyền qua fragment: not-cloned.html#/admin/inventory/suppliers/123
    (function () {
      var h = location.hash ? decodeURIComponent(location.hash.slice(1)) : '';
      if (h) document.getElementById('target').textContent = h;
    })();
  </script>
</body>
</html>
